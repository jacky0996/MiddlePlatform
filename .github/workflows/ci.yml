name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.8.4

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format --check
        run: ruff format --check .

  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system deps for mysqlclient
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config build-essential

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Django system check
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
        run: python manage.py check --deploy --fail-level WARNING || true
        # --deploy 會 warn 各種 production 設定問題;fail-level 設 WARNING 但 || true
        # 暫不擋 PR(現在大多是預期的 dev warning),之後設定收斂可改為 fail

      - name: Run pytest
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
        run: pytest --cov=apps --cov-report=term-missing

  docker-build-dev:
    name: Docker build (dev Dockerfile)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: middle-platform:ci
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

  docker-build-prod:
    name: Docker build (Cloud Run Dockerfile.prod)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build prod image (no push)
        # CI 只驗 build 過,不 push。push + deploy 由 Jenkins 在 main merge 後執行
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: false
          tags: middle-platform:ci-prod
          cache-from: type=gha,scope=prod
          cache-to: type=gha,mode=max,scope=prod
